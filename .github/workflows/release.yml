name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build release
        run: make release VERSION=${{ github.ref_name }}

      - name: List artifacts
        run: |
          ls -R build/release
          cat build/release/checksums.txt

      - name: Prepare release notes
        run: |
          tag="${{ github.ref_name }}"
          body="$(git for-each-ref "refs/tags/$tag" --format='%(contents:body)' | sed -e '/./,$!d')"
          {
            if [ -n "$body" ]; then printf '%s\n\n' "$body"; fi
            echo '## Контрольные суммы (SHA-256)'
            echo
            echo '```'
            cat build/release/checksums.txt
            echo '```'
          } > body.md
          cat body.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: body.md
          files: |
            build/release/*.zip
            build/release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
