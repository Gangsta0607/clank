name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build release
        run: make release VERSION=${{ github.ref_name }}

      - name: List artifacts
        run: |
          ls -R build/release
          cat build/release/checksums.txt

      - name: Prepare release notes
        run: |
          tag="${{ github.ref_name }}"
          # Аннотацию тега (туда make publish кладёт NOTES) явно дотягиваем:
          # checkout не гарантирует объект тега в клоне, без него тело пустое.
          git fetch origin "+refs/tags/$tag:refs/tags/$tag" || true
          body="$(git for-each-ref "refs/tags/$tag" --format='%(contents:body)' | sed -e '/./,$!d')"
          printf '%s\n' "$body" > body.md
          cat body.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: body.md
          files: |
            build/release/*.zip
            build/release/*.tar.gz
            build/release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
